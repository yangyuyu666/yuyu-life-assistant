name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "settings.gradle.kts"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android migration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Validate signing secrets
        env:
          SIGNING_KEY: ${{ secrets.YUYU_SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.YUYU_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YUYU_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.YUYU_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY" || { echo "Missing YUYU_SIGNING_KEY_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing YUYU_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing YUYU_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing YUYU_KEY_PASSWORD"; exit 1; }

      - name: Restore release keystore
        env:
          SIGNING_KEY: ${{ secrets.YUYU_SIGNING_KEY_BASE64 }}
        run: printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/yuyu-release.jks"

      - name: Build signed APK
        env:
          YUYU_KEYSTORE_PATH: ${{ runner.temp }}/yuyu-release.jks
          YUYU_KEYSTORE_PASSWORD: ${{ secrets.YUYU_KEYSTORE_PASSWORD }}
          YUYU_KEY_ALIAS: ${{ secrets.YUYU_KEY_ALIAS }}
          YUYU_KEY_PASSWORD: ${{ secrets.YUYU_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release signing certificate
        env:
          EXPECTED_CERT_SHA256: 50739f4150d71bc6117ad5d28b78f23fe9b6a587c3e5722067f60b7b5dc497b3
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' -print -quit)
          APKSIGNER_PATH=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APK_PATH" || { echo "Release APK not found"; exit 1; }
          test -n "$APKSIGNER_PATH" || { echo "apksigner not found"; exit 1; }
          ACTUAL_CERT_SHA256=$(
            "$APKSIGNER_PATH" verify --print-certs "$APK_PATH" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p'
          )
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256" || {
            echo "Release signing certificate mismatch"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yuyu-life-assistant-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
